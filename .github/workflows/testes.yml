# Testes em Docker a cada push/PR, a partir de um clone limpo. Senhas descartáveis geradas na hora; não usa segredos do repositório.
name: Testes
on:
  push:
    branches: [main, staging]
  pull_request:
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gerar .env descartável
        run: |
          cp .env.example .env
          for v in DB_PASSWORD DEMO_DB_PASSWORD APP_DB_PASSWORD OFICINA_PIX_WEBHOOK_SEGREDO REDIS_PASSWORD; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 24)/" .env
          done
      - name: Rodar testes
        run: docker compose --profile test run --rm --build test
