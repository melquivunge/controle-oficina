# Testes em Docker a cada push/PR. Em main e staging, depois dos testes: imagem construída no servidor e deploy.
# ponytail: build no servidor, sem registro de imagens (push ao GHCR recusado em 05/11/2026, causa não confirmada).
# Segredos do repositório: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. Sem eles, para antes do deploy.
name: Testes e deploy
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Gerar .env descartável
        run: |
          cp .env.example .env
          for v in DB_PASSWORD DEMO_DB_PASSWORD APP_DB_PASSWORD OFICINA_PIX_WEBHOOK_SEGREDO REDIS_PASSWORD; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 24)/" .env
          done
      - name: Rodar testes
        run: docker compose --profile test run --rm --build test
  deploy:
    needs: phpunit
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-servidor # uma atualização por vez no servidor
      cancel-in-progress: false
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      IMAGEM: oficina-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Conferir segredos
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: test -n "$HOST" || { echo "::error::Segredo DEPLOY_HOST não configurado"; exit 1; }
      - name: Configurar SSH
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          CONHECIDOS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CONHECIDOS" > ~/.ssh/known_hosts
      - name: Atualizar servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          D=/opt/oficina/$AMBIENTE
          git archive --format=tar.gz HEAD \
            | ssh "deploy@$HOST" "rm -rf $D/fonte && mkdir -p $D/fonte && tar -xzf - -C $D/fonte"
          ssh "deploy@$HOST" "set -e; cd $D && docker build -q --target app -f fonte/docker/Dockerfile -t '$IMAGEM' fonte \
            && cp -R fonte/compose.yaml fonte/deploy . && mkdir -p docker && cp -R fonte/docker/postgres fonte/docker/scripts docker/ \
            && deploy/deploy.sh $AMBIENTE '$IMAGEM'"
