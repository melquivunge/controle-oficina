# Testes em Docker a cada push/PR. Em main e staging, depois dos testes: imagem no GHCR e deploy no servidor.
# Segredos do repositório: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. Sem eles, para antes do deploy.
name: Testes e deploy
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gerar .env descartável
        run: |
          cp .env.example .env
          for v in DB_PASSWORD DEMO_DB_PASSWORD APP_DB_PASSWORD OFICINA_PIX_WEBHOOK_SEGREDO REDIS_PASSWORD; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 24)/" .env
          done
      - name: Rodar testes
        run: docker compose --profile test run --rm --build test
  deploy:
    needs: phpunit
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-servidor # uma atualização por vez no servidor
      cancel-in-progress: false
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      IMAGEM: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: test -n "$HOST" || { echo "::error::Segredo DEPLOY_HOST não configurado"; exit 1; }
      - name: Publicar imagem
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --target app -f docker/Dockerfile -t "$IMAGEM" .
          docker push "$IMAGEM"
      - name: Configurar SSH
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          CONHECIDOS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CONHECIDOS" > ~/.ssh/known_hosts
      - name: Atualizar servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ github.token }}
        run: |
          tar -czf - compose.yaml deploy docker/postgres docker/scripts \
            | ssh "deploy@$HOST" "tar -xzf - -C /opt/oficina/$AMBIENTE"
          echo "$TOKEN" | ssh "deploy@$HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "deploy@$HOST" "cd /opt/oficina/$AMBIENTE && deploy/deploy.sh $AMBIENTE '$IMAGEM'; c=\$?; docker logout ghcr.io; exit \$c"
